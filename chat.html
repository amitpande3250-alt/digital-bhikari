<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Bhikhari AI</title>
  <style>
    body { background: #0f172a; color: white; display: flex; justify-content: center; height: 100vh; font-family: sans-serif; }
    .card { width: 100%; max-width: 450px; display: flex; flex-direction: column; height: 100%; }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { padding: 10px; margin: 5px; border-radius: 10px; }
    .ai { background: #334155; align-self: flex-start; }
    .user { background: #f59e0b; color: black; align-self: flex-end; }
    .input-area { padding: 20px; display: flex; }
    input { flex: 1; padding: 10px; border-radius: 5px; }
    button { padding: 10px; background: #f59e0b; border: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Bol kanjoos, kya chahiye? (Mode: <span id="currentMode">Roast</span>)</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Kuch likho...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let currentPersona = localStorage.getItem('persona') || 'savage';

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // Mode detection logic
      if (text.toLowerCase().includes('respect') || text.toLowerCase().includes('izzat') || text.toLowerCase().includes('acche se')) {
        currentPersona = 'respectful';
        localStorage.setItem('persona', 'respectful');
        document.getElementById('currentMode').innerText = 'Respectful';
      } else if (text.toLowerCase().includes('roast') || text.toLowerCase().includes('gali') || text.toLowerCase().includes('savage')) {
        currentPersona = 'savage';
        localStorage.setItem('persona', 'savage');
        document.getElementById('currentMode').innerText = 'Roast';
      }

      appendMessage(text, 'user');
      input.value = '';

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, persona: currentPersona })
      })
      .then(res => res.json())
      .then(data => appendMessage(data.reply, 'ai'));
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
